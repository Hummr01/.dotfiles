# #######################################################################################
# CLEANED HYPR CONFIGURATION
# #######################################################################################

# 1. Source Environment Configurations
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/style.conf

# 2. Preferred Applications
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -run-command "uwsm app -- {cmd}"
$browser = brave -use-gl=egl

# 3. Autostart Processes (Systemd-integrated via UWSM)
exec-once = [workspace 1 silent] uwsm app -- $terminal
exec-once = [workspace 9 silent] uwsm app -- keepassxc
exec-once = uwsm app -- swaync

# NOTE: The multi-user steam share script execution has been removed from here.
# It should be run as a systemd service at boot time, not user session time.

# 4. Input Configuration
input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# 5. Device Profiles
device {
    name = opentabletdriver-virtual-artist-tablet
    output = DP-1
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# 6. Bindings & Rules Mapping
source = ~/.config/hypr/keymaps.conf 
source = ~/.config/hypr/windows.conf
